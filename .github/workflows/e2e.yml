name: e2e

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/e2e.yml"]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-insecure-secret-key
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER taskflow WITH PASSWORD 'taskflow-dev-password' CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE taskflow OWNER taskflow;"
      - name: Apply migrations
        run: python backend/manage.py migrate --settings config.settings.test --noinput
      - name: Run backend API server
        run: |
          python backend/manage.py runserver 0.0.0.0:8000 --settings config.settings.test &
          echo $! > /tmp/backend.pid
        # Wait for readiness (DB-dependent; health stays green even if DB is down)
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/ready/ && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/ready/
      - name: Run frontend dev server
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 &
          echo $! > /tmp/frontend.pid
        working-directory: frontend
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5173/ >/dev/null && break
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:5173/
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
