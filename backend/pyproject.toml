[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow backend — Django 5 + DRF task management API"
# No `readme`: the repo README lives outside backend/ (PEP 621 project root),
# and modern setuptools refuses files outside the project directory.
requires-python = ">=3.12"
license = "BSD-2-Clause"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "drf-spectacular>=0.28,<1.0",
    "django-filter>=24.3,<25.0",
    "django-cors-headers>=4.4,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.12,<1.0",
]
prod = [
    "gunicorn>=23,<24",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"apps/**/migrations/*.py" = ["E501", "I001"]
